<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EWA Demo Filler</title>
  <style>
    body { width:260px; margin:0; padding:16px; color:#263234; background:#fff; font:14px/1.45 Arial,sans-serif; }
    h1 { margin:0 0 6px; font-size:16px; }
    p { margin:0 0 14px; color:#5c6668; font-size:12px; }
    button { width:100%; min-height:38px; border:0; border-radius:999px; background:#af1f72; color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
    button:hover { background:#94145e; }
    #status { min-height:18px; margin:10px 0 0; font-size:12px; }
  </style>
</head>
<body>
  <h1>EWA profile demo</h1>
  <p>Fill the current lead-profile page with synthetic test data.</p>
  <button id="populate" type="button">Populate test profile</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
